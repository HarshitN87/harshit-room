<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harshit Room in 3D</title>
    <meta name="description" content="A hand-detailed cozy 3D room diorama in the browser, built procedurally with Three.js." />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="loader"><div class="spin"></div><p>warming up the room…</p></div>
    <canvas id="scene"></canvas>
    <div class="vignette"></div>

    <div class="hud">
      <div class="hud-title">harshit room in 3D <span>· cozy diorama</span></div>
      <div class="hud-sub">drag to orbit &nbsp;•&nbsp; scroll to zoom &nbsp;•&nbsp; click lamp / laptop / pendant</div>
      <div class="chips">
        <button id="chip-lamp">💡 Lamp</button>
        <button id="chip-screen">🖥 Screen</button>
        <button id="chip-light">🔆 Pendant</button>
        <button id="chip-daynight">☀️ Day</button>
      </div>
      <div id="toast" class="toast hidden">Lamp on</div>
    </div>

    <div class="badge">three.js + vite · homage to brunosimon/my-room-in-3d</div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
