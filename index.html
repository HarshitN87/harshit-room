<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozy Room in 3D</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0b0c10;
      font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e5e7eb;
    }
    
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    
    /* Sleek UI panel */
    #ui-container {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 320px;
    }
    
    .panel {
      background: rgba(15, 17, 23, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px rgba(255, 255, 255, 0.08) solid;
      border-radius: 16px;
      padding: 20px;
      pointer-events: auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.8s ease-out;
    }
    
    h1 {
      font-size: 20px;
      margin: 0 0 6px 0;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #a5f3fc, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .description {
      font-size: 13px;
      color: #9ca3af;
      line-height: 1.5;
      margin: 0 0 16px 0;
    }
    
    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px rgba(255, 255, 255, 0.1) solid;
      color: #e5e7eb;
      padding: 10px 14px;
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 500;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .btn:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
      transform: translateY(-1px);
    }
    
    .btn.active {
      background: rgba(56, 189, 248, 0.25);
      border-color: #38bdf8;
      color: #ffffff;
    }
    
    /* Loader overlay */
    #loader {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0b0c10;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease-out;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px rgba(56, 189, 248, 0.1) solid;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin-bottom: 20px;
    }
    
    .loader-text {
      font-size: 14px;
      color: #9ca3af;
      letter-spacing: 1px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <div class="loader-text" id="loader-percent">LOADING 3D ROOM: 0%</div>
  </div>

  <div id="canvas-container"></div>
  

  <script type="module" src="/src/main.js"></script>
</body>
</html>
